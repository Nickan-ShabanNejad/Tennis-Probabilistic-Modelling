name: Live slate (predictions + bet log)

on:
  schedule:
    - cron: "5 * * * *"       # every hour (fixtures, predictions, closing-line snapshots)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atp-edge-writer
  cancel-in-progress: false

jobs:
  slate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Predict upcoming matches and log recommendations
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: AI-written match previews
          MIN_EV: ${{ vars.MIN_EV }}
          MIN_EDGE: ${{ vars.MIN_EDGE }}
          KELLY_FRACTION: ${{ vars.KELLY_FRACTION }}
          KELLY_CAP: ${{ vars.KELLY_CAP }}
          BET_BOOKS: ${{ vars.BET_BOOKS }}
          ODDS_API_REGIONS: ${{ vars.ODDS_API_REGIONS || 'eu' }}
          # Hours between paid price pulls. 1 = every run. Set the repo variable to 4 to stay on the free plan.
          ODDS_REFRESH_HOURS: ${{ vars.ODDS_REFRESH_HOURS || '1' }}
        run: python scripts/run_slate.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "Slate $(date -u +'%F %H:%M')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
