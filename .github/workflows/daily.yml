name: Daily data refresh, settlement and retrain

on:
  schedule:
    - cron: "20 8 * * *"      # 08:20 UTC every day (after the night's results are in)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atp-edge-writer
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Refresh data and settle yesterday's bets
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python scripts/update_data.py

      - name: Retrain ratings and models
        run: python scripts/train.py

      - name: Tests
        run: pytest -q

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data model
          git diff --cached --quiet && exit 0
          git commit -m "Daily refresh $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
